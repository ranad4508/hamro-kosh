name: hamro_kosh
description: "Transparent community fund, expense and lending management application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3

  # Navigation
  go_router: ^17.5.0

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  firebase_messaging: ^16.6.0
  firebase_app_check: ^0.4.7

  # Local persistence & device capability
  shared_preferences: ^2.5.5
  local_auth: ^3.0.2
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1

  # Design system
  google_fonts: ^8.2.1

  # Bikram Sambat (Nepali) calendar — every date in the reference design is
  # shown in BS, e.g. "2 Bhadra 2083".
  nepali_utils: ^3.0.8

  # Formatting & charts
  intl: 0.20.2
  fl_chart: ^1.2.0
  awesome_snackbar_content: ^0.1.8
  http: ^1.6.0
  cloud_functions: ^6.4.0
  csv: ^8.0.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/AppIcons/appstore.png"
  adaptive_icon_background: "#171221"
  adaptive_icon_foreground: "assets/AppIcons/android/adaptive-foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FAF9FF"
  image: assets/images/hk_icon_splash.png
  color_dark: "#171221"
  image_dark: assets/images/hk_icon_splash.png
  android_12:
    image: assets/images/hk_icon_splash.png
    icon_background_color: "#FAF9FF"
    image_dark: assets/images/hk_icon_splash.png
    icon_background_color_dark: "#171221"
  android: true
  ios: true
  web: false
